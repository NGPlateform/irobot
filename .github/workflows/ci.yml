name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  js:
    name: JS 测试（pnpm）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r test

  rust:
    name: Rust 边缘运行时测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - name: cargo test
        working-directory: edge/runtime
        run: cargo test
